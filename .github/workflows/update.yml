name: Actualizar SST + Corrientes

on:
  schedule:
    - cron: '0 8 * * *'  # Ejecuta todos los días a las 8:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update_figures:
    runs-on: ubuntu-latest

    env:
      COPERNICUS_USERNAME: ${{ secrets.COPERNICUS_USERNAME }}
      COPERNICUS_PASSWORD: ${{ secrets.COPERNICUS_PASSWORD }}

    steps:
      # 1️⃣ Clonar el repositorio
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2️⃣ Configurar Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      # 3️⃣ Instalar dependencias
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade copernicusmarine
          pip install numpy matplotlib cartopy xarray h5py netCDF4 scipy

      # 4️⃣ Ejecutar script
      - name: Run auto script
        run: python scripts/script_auto.py

      # 5️⃣ Commit + push
      - name: Commit and push latest.png
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add figures/latest.png figures/series_temporal_point.png
          git add figures/latest.png \
            figures/series_temporal_point.png \
            figures/SSTgeo.png \
            figures/CHLgeo.png \
            figures/SSHgeo.png
          git push